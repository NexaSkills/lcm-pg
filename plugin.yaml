name: lcm-pg
# Registry key = the `key:` (or directory name); the manifest `name` is also
# accepted by the gate as a lookup alias. The legacy name 'hermes-lcm' is
# retired fleet-wide (Jan 2026-10-27): lcm-pg REPLACES it. Keeping name:
# hermes-lcm here meant gate_manifest matched a stale 'hermes-lcm' entry in
# plugins.enabled from any home scope and loaded this plugin under the old
# identity — exactly what made hermes-lcm keep 'existing' on the fleet.
# With name: lcm-pg, ONLY 'lcm-pg' in plugins.enabled activates this plugin.
# (The engine's internal name stays 'lcm' = context.engine value; the bundled
# skill id 'hermes-lcm' in __init__.py refers to the skills/hermes-lcm DIR,
# not the plugin identity, and is unchanged.)
key: lcm-pg
version: 1.0.0-rc.1
description: "Lossless Context Management — standalone Hermes plugin with a DAG-based context engine that never loses a message"
author: "Voltropy / Hermes Community"
provides_tools:
  - lcm_grep
  - lcm_recall
  - lcm_query_state
  - lcm_compute
  - lcm_compile_evidence
  - lcm_evidence_pack
  - lcm_retrieve
  - lcm_recent
  - lcm_load_session
  - lcm_describe
  - lcm_expand
  - lcm_expand_query
  - lcm_status
  - lcm_inspect
  - lcm_doctor
